<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <!-- Header Start Here -->
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="images/cafe.png" alt="Logo" width="30" height="24"
            class="d-inline-block align-text-top">Brew'n'Bite</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html"><i class="bi bi-house-door"></i>Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html"><i class="bi bi-info-circle"></i>About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="menu.html"><i class="bi bi-menu-button"></i>Menu</a>
            </li> 
            <li class="nav-item">
              <a class="nav-link" href="services.html"><i class="bi bi-gear"></i>Services</a>
            </li>         
            <li class="nav-item">
              <a class="nav-link active" href="contact.html"><i class="bi bi-telephone"></i>Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <!-- Header End Here -->
  <main>
    <section class="mt-3">
      <div class="container">
        <div class="row">
          <div class="col-md-6">
            <form>
              <div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Name</label>
                  <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter Full Name">
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Date of Birth</label>
                  <input type="date" class="form-control" id="exampleFormControlInput1"
                    placeholder="Enter Date of Birth">
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Email</label>
                  <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlInput1" class="form-label">Enter Phone Number</label>
                  <input type="number" class="form-control" id="exampleFormControlInput1"
                    placeholder="Enter Phone Number">
                </div>
                <div class="mb-3">
                  <label for="exampleFormControlTextarea1" class="form-label">Enter Address</label>
                  <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>
                <div class="mb-3">
                  <button type="submit" class="btn btn-success">Submit Form</button>
                  <button type="reset" class="btn btn-danger">Reset Form</button>
                </div>
              </div>
            </form>
          </div>
          <div class="col-md-6">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d120985.46388477407!2d73.6324239972656!3d18.628254600000005!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2b90907083469%3A0xf15f12e419146ae4!2sBrew%20nation!5e0!3m2!1sen!2sin!4v1785995900585!5m2!1sen!2sin"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
